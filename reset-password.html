<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/x-icon" href="favicon.ico?v=20261029-2">
<meta charset="UTF-8">
<meta http-equiv="refresh" content="0;url=forgot-password.html">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BCIHS Library</title>
<link rel="stylesheet" href="css/reset-password.css">
<link rel="stylesheet" href="css/library-ui.css?v=phase8">
<link rel="stylesheet" href="css/phase9.css?v=20261028">
</head>
<body class="auth-page">
<header>
  <a class="brand" href="index.html">
    <div class="logo">
      <img src="images/logo.jpeg" alt="BCIHS seal" class="extracted-style-1">
    </div>
    <div class="school-name">Batangas City Integrated High School</div>
  </a>
</header>

<section class="reset-hero">
  <div class="reset-card">
    <h1>Set New Password</h1>
    <p class="subtitle">Enter the OTP sent to your phone and create a new password.</p>

    <div id="messageBox" class="message-box extracted-style-2"></div>

    <form id="resetForm" method="POST" action="backend/reset-password-process.php" novalidate>
      <input type="hidden" id="phoneNumber" name="phone">
      <div class="field">
        <label for="otpCode">OTP Code</label>
        <input type="text" id="otpCode" name="otp" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP" required>
      </div>

      <div class="field">
        <label for="newPassword">New Password</label>
        <div class="password-wrap">
          <input type="password" id="newPassword" name="new_password" placeholder="At least 8 characters" required>
          <button type="button" class="toggle-password" id="togglePasswordOne" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label for="confirmPassword">Confirm Password</label>
        <div class="password-wrap">
          <input type="password" id="confirmPassword" name="confirm_password" placeholder="Re-enter your new password" required>
          <button type="button" class="toggle-password" id="togglePasswordTwo" aria-label="Show password">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="submit-btn">Reset password</button>
    </form>

    <p class="helper"><a href="login.html">Return to login</a></p>
  </div>
</section>

<script src="js/library-ui.js?v=phase8"></script>
<script src="js/reset-password.js"></script>
</body>
</html>
