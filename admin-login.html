<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Staff Login | BCIHS Library</title>
<link rel="stylesheet" href="css/admin-login.css">
<link rel="stylesheet" href="css/library-ui.css?v=phase8">
</head>
<body class="auth-page">
<header>
  <a class="brand" href="index.html">
    <div class="logo">
      <img src="images/logo.jpeg" alt="BCIHS seal" class="extracted-style-1">
    </div>
    <div class="school-name">Batangas City Integrated High School</div>
  </a>
</header>

<section class="login-hero">
  <form class="login-card" id="adminLoginForm" method="POST" action="backend/admin-login-process.php" novalidate>
    <h1>Staff Portal</h1>
    <p class="subtitle">Sign in with your authorized librarian or administrator account</p>

    <div class="field">
      <label for="identifier">School ID or Username</label>
      <input type="text" id="identifier" name="identifier" placeholder="School ID, username, or registered email" autocomplete="username" required>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" id="eyeIcon">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>

    <p class="error-msg" id="errorMsg"></p>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" name="remember">
        Remember me
      </label>
      <a href="forgot-password.html" class="forgot-link" id="forgotLink">Forgot Password?</a>
    </div>

    <button type="submit" class="submit-btn" id="submitBtn">Log In</button>

    <hr class="divider">

    <p class="signup-line">Need a patron account? <a href="login.html">User Login</a></p>
    <a href="index.html" class="back-home">&larr; Back to Homepage</a>
  </form>
</section>

<script src="js/library-ui.js?v=phase8"></script>
<script src="js/admin-login.js?v=20261027-phase3b"></script>
</body>
</html>
